<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>

  <!-- Chess Board stylized pattern subtle background -->
  <g opacity="0.07">
    <rect x="64" y="64" width="96" height="96" fill="#ffffff"/>
    <rect x="256" y="64" width="96" height="96" fill="#ffffff"/>
    <rect x="160" y="160" width="96" height="96" fill="#ffffff"/>
    <rect x="352" y="160" width="96" height="96" fill="#ffffff"/>
    <rect x="64" y="256" width="96" height="96" fill="#ffffff"/>
    <rect x="256" y="256" width="96" height="96" fill="#ffffff"/>
    <rect x="160" y="352" width="96" height="96" fill="#ffffff"/>
    <rect x="352" y="352" width="96" height="96" fill="#ffffff"/>
  </g>

  <!-- Glowing Chess Knight piece -->
  <g transform="translate(110, 80) scale(0.6)" filter="url(#glow)">
    <path d="M 120 400 L 380 400 C 375 370 355 350 330 340 C 345 320 350 290 340 260 C 325 215 285 180 280 140 C 278 120 285 95 295 70 C 275 75 250 85 230 105 C 220 90 205 78 185 70 C 180 95 180 120 185 140 C 160 145 130 160 110 190 C 95 212 95 240 110 265 C 120 280 140 288 160 290 C 135 320 120 360 120 400 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Knight Eye -->
    <circle cx="215" cy="175" r="14" fill="#0f172a"/>
    <circle cx="218" cy="172" r="5" fill="#38bdf8"/>
    <!-- Mane details -->
    <path d="M 275 145 Q 315 190 325 245" stroke="#0f172a" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.3"/>
    <path d="M 290 215 Q 320 250 315 290" stroke="#0f172a" stroke-width="10" stroke-linecap="round" fill="none" opacity="0.3"/>
    <!-- Base decoration -->
    <rect x="100" y="400" width="300" height="35" rx="12" fill="#ffffff"/>
    <rect x="120" y="445" width="260" height="25" rx="10" fill="#38bdf8"/>
  </g>

  <!-- Stockfish evaluation bar indicator on the left -->
  <g transform="translate(48, 120)">
    <rect width="18" height="270" rx="9" fill="#334155"/>
    <rect y="130" width="18" height="140" rx="9" fill="url(#boardGrad)"/>
    <circle cx="9" cy="130" r="7" fill="#fbbf24"/>
  </g>

  <!-- Brilliant Move Badge (!!) on the bottom right -->
  <g transform="translate(320, 320)">
    <circle cx="64" cy="64" r="56" fill="url(#cyanGrad)" filter="url(#glow)"/>
    <circle cx="64" cy="64" r="50" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
    <!-- Exclamation marks -->
    <text x="50" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
    <text x="78" y="78" font-family="system-ui, -apple-system, sans-serif" font-size="54" font-weight="900" fill="#ffffff" text-anchor="middle">!</text>
  </g>

  <!-- Stockfish version badge at top right -->
  <g transform="translate(330, 48)">
    <rect width="134" height="38" rx="19" fill="#047857" opacity="0.95"/>
    <text x="67" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ecfdf5" text-anchor="middle" letter-spacing="1">STOCKFISH 19</text>
  </g>
</svg>
